name: Android build

# Runs only when commits land on main (direct pushes or merged pull requests).
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Gradle project lives in app/.
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships with the Android SDK (ANDROID_HOME is set).
      - name: Build, lint and assemble
        run: ./gradlew build

      # Keep the debug APK so it can be downloaded from the workflow run page.
      # Paths are relative to the repository root (the default working-directory
      # only applies to `run` steps).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
